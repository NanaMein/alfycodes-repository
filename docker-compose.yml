
services:
  ghost_cms_database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ghost_cms_postgres_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ghost_production:
    image: ghost:latest
    depends_on:
      ghost_cms_database:
        condition: service_healthy
    environment:
      url: https://${DOMAIN}

      database__client: mysql
      database__connection__host: ghost_cms_database
      database__connection__user: ${MYSQL_USER}
      database__connection__password: ${MYSQL_PASSWORD}
      database__connection__database: ${MYSQL_DB}


      # --- Brevo SMTP Configuration ---
      mail__transport: "SMTP"
      mail__from: "${SMTP_FROM}"
      mail__options__host: "smtp-relay.brevo.com"
      mail__options__port: 587
      mail__options__secure: false
      mail__options__requireTLS: true
      mail__options__auth__user: "${SMTP_USER}"
      mail__options__auth__pass: "${SMTP_PASS}"

    ports:
      - "127.0.0.1:2368:2368"
    volumes:
      - ghost_cms_content_data:/var/lib/ghost/content
    restart: unless-stopped

  nginx:
    profiles: ["docker-nginx"]
    image: nginx:alpine
    network_mode: host
    depends_on:
      - ghost_production
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    profiles: ["docker-nginx"]
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  ghost_cms_postgres_data:
  ghost_cms_content_data:
  certbot-www:
  certbot-certs:
